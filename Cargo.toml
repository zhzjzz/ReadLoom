[workspace]
resolver = "2"
members = ["crates/readloom-core", "crates/readloom-slint"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
blake3 = "=1.8.5"
chardetng = "=1.0.0"
encoding_rs = "=0.8.35"
fontdb = { version = "=0.23.0", default-features = false, features = ["std", "fs"] }
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
quick-xml = { version = "=0.40.1", features = ["escape-html"] }
regex = "=1.13.1"
rbook = { version = "=0.7.10", default-features = false, features = ["threadsafe"] }
rfd = { version = "=0.16.0", default-features = false }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.19"
tray-icon = { version = "=0.24.2", default-features = false }
unicode-normalization = "=0.1.25"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
slint = { version = "=1.16.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "unstable-winit-030",
] }
slint-build = "=1.16.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
