[package]
name = "readloom"
version = "0.1.0"
description = "Readloom local-first reading workspace"
authors = ["Readloom contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "readloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
ammonia = "=4.1.4"
base64 = "=0.22.1"
blake3 = "=1.8.5"
chardetng = "=1.0.0"
cssparser = "=0.37.0"
encoding_rs = "=0.8.35"
getrandom = "=0.3.4"
percent-encoding = "=2.3.2"
quick-xml = { version = "=0.40.1", features = ["escape-html"] }
rbook = { version = "=0.7.10", default-features = false, features = ["threadsafe"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
thiserror = "=2.0.19"
unicode-normalization = "=0.1.25"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
