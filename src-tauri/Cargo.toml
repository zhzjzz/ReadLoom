[package]
name = "readloom"
version = "0.1.0"
description = "Readloom local-first reading workspace"
authors = ["Readloom contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "readloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
blake3 = "=1.8.5"
chardetng = "=1.0.0"
encoding_rs = "=0.8.35"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
thiserror = "=2.0.19"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
